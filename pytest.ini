[pytest]
python_files = test_*.py
# A bare `python -m pytest` collects code/ only. The regression tests under
# tools/ run through `python tools/run_mandatory_suite.py`, which is the
# acceptance bar (REPRODUCE.md); a bare pytest pass does not meet that bar.
# Runnable observer work has its own explicit gate: `python -m model.verify`
# and `python -m pytest -q -W error model` (observer-model.yml).
testpaths = code
