# Keeps the commit-SHA pins on third-party Actions and the version pins in
# requirements.txt current. Each update arrives as a pull request that
# changes one pin and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # CAMB is pinned to the version of the archived observer-dynamics
      # evidence: its interpolation control runs only under the CAMB recorded
      # in the frozen spec.json (1.6.6), and the verifier fails on a skipped
      # control. A newer CAMB belongs in a separate environment for new
      # transfer runs, not in this replay pin.
      - dependency-name: camb
