name: Cosmology posterior accounting
on:
  pull_request:
    paths:
      - 'code/cosmology/fixed_capacity_wlaw/**'
      - 'code/cosmology/postdiction_ledger/**'
      - 'requirements.txt'
      - '.github/workflows/cosmology-accounting.yml'
  push:
    branches: [main]
    paths:
      - 'code/cosmology/fixed_capacity_wlaw/**'
      - 'code/cosmology/postdiction_ledger/**'
      - 'requirements.txt'
      - '.github/workflows/cosmology-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posterior-accounting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Independent moments, boundary controls and corrupt-receipt refusals
        run: python -m pytest -q code/cosmology/fixed_capacity_wlaw code/cosmology/postdiction_ledger -W error
      - name: Replay the downstream live ledger independently
        run: python code/cosmology/postdiction_ledger/verify_cosmology_postdiction_ledger_independent.py
