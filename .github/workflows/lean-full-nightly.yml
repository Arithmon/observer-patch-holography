name: Lean Full Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  # A scheduled main build must not preempt a manual review build.
  group: lean-full-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan
        run: |
          set -euo pipefail
          # Pinned elan release, verified against its published sha256.
          elan_version=v4.2.4
          elan_sha256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${elan_version}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${elan_sha256}  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Lean/.lake/build
            Lean/ObservableNormalForms/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-

      - name: Check zero proof debt and no axiom declarations
        working-directory: Lean
        run: |
          set -euo pipefail
          if rg -n '^\s*(sorry|admit)\b|(:=|\bby|\bexact|\brefine|·)\s*(sorry|admit)\b' \
              . --glob '*.lean' --glob '!**/.lake/**'; then
            echo "Unexpected Lean admission." >&2
            exit 1
          fi
          if rg -n '^\s*(@\[[^]]*\]\s*)?((private|protected|noncomputable|unsafe)\s+)*axiom\s+[^\s:({\[]+\s*[:({\[]' \
              . --glob '*.lean' --glob '!**/.lake/**'; then
            echo "Unexpected axiom declaration in the Lean tree." >&2
            exit 1
          fi

      - name: Fetch Mathlib olean cache
        working-directory: Lean
        run: lake exe cache get

      - name: Build the complete default target set
        working-directory: Lean
        run: |
          set -euo pipefail
          # Record host pressure without process arguments or environment data.
          python3 -u - <<'PY' &
          import datetime
          import pathlib
          import subprocess
          import time

          while True:
              print("Lean host snapshot", datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
              for command in (["free", "-m"], ["df", "-h", "."]):
                  subprocess.run(command, check=False, timeout=10)
              for name in ("/sys/fs/cgroup/memory.events", "/sys/fs/cgroup/memory/memory.failcnt"):
                  path = pathlib.Path(name)
                  if path.is_file():
                      print(name, path.read_text(), flush=True)
              processes = subprocess.run(["ps", "-eo", "pid,comm,rss", "--sort=-rss"],
                                         capture_output=True, text=True, check=False, timeout=10)
              print("\n".join(processes.stdout.splitlines()[:12]), flush=True)
              time.sleep(60)
          PY
          monitor_pid=$!
          finish() {
            build_status=$?
            trap - EXIT
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            exit "$build_status"
          }
          trap finish EXIT
          trap 'echo "Lean build received SIGTERM" >&2; exit 143' TERM
          lake build

      - name: Run the FZ-12 joint-threshold certificate suite
        # The producer replays `lake build SeamCurrentPhotonLeptonThreshold`
        # and its axiom audit, so it runs after the full build rather than in
        # the Python-only mandatory suite.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest==9.1.1 sympy==1.14.0 mpmath==1.3.0
          python3 -m pytest -q code/a5_fingerprint/test_fz12_joint_threshold_certificate.py

      - name: Build the frozen OphGap certificate
        working-directory: Lean
        run: lake build OphGap

      - name: Build the neutral submission artifact
        working-directory: Lean/ObservableNormalForms
        run: |
          lake exe cache get
          lake build

      - name: Save Lake build cache
        # Completed artifacts may be reused after a failed build; Lake still
        # checks source/dependency traces. Saving never turns a failure green.
        if: always() && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Lean/.lake/build
            Lean/ObservableNormalForms/.lake/build
          key: lean-core-v3-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lakefile.lean', 'Lean/lake-manifest.json', 'Lean/ObservableNormalForms/lean-toolchain', 'Lean/ObservableNormalForms/lakefile.lean', 'Lean/ObservableNormalForms/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
