name: Whitney Kinetic and Packet Observables

on:
  push:
    branches: [main]
    paths:
      - 'code/electromagnetism/**'
      - 'requirements.txt'
      - '.github/workflows/neutral-packet.yml'
  pull_request:
    paths:
      - 'code/electromagnetism/**'
      - 'requirements.txt'
      - '.github/workflows/neutral-packet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutral-packet:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Independently replay neutral packet observables and challenge their domain
        run: python -m pytest -q -W error code/electromagnetism/test_neutral_packet_observables.py code/electromagnetism/test_whitney_quantum_packet.py
      - name: Challenge original-input kinetic minima, densities and independent replay
        run: >-
          python -m pytest -q -W error
          code/electromagnetism/test_whitney_interacting_quantum.py
          code/electromagnetism/test_whitney_kinetic_precision.py
          code/electromagnetism/test_whitney_kinetic_inputs.py
          code/electromagnetism/test_whitney_kinetic_replay.py
          code/electromagnetism/test_whitney_kinetic_scale.py
          code/electromagnetism/test_whitney_public_scale.py
