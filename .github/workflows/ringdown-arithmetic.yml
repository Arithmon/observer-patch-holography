name: Ringdown template arithmetic

on:
  pull_request:
    paths: &inputs
      - 'code/gravitation/ringdown_comb/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/ringdown-arithmetic.yml'
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic-and-replay:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute every ringdown arithmetic and receipt control
        run: python -W error -m pytest -q code/gravitation/ringdown_comb
