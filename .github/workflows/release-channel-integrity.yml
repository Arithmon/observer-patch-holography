name: Release Channel Integrity

# Publication is a manual maintainer action. This manually dispatched,
# read-only audit compares the local manifest bundle with the bytes exposed by
# the latest public GitHub Release; it never creates or uploads a release.
on:
  workflow_dispatch:

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check latest public release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_github_release_channel.py
