name: Finite collar certificates
on:
  pull_request:
    paths:
      - 'code/yang_mills/**'
      - 'tools/strict_json.py'
      - 'requirements.txt'
      - '.github/workflows/collar-gap.yml'
  push:
    branches: [main]
    paths:
      - 'code/yang_mills/**'
      - 'tools/strict_json.py'
      - 'requirements.txt'
      - '.github/workflows/collar-gap.yml'
permissions:
  contents: read
jobs:
  exact-certificates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: >-
          python -m pytest -q -W error
          code/yang_mills/test_collar_gap_certificate.py
          code/yang_mills/tests/test_finite_collar_gap_certificate.py
          code/yang_mills/tests/test_collar_certificate_accounting.py
          tools/test_strict_json.py
