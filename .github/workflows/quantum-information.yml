name: Finite quantum information
on:
  pull_request:
    paths:
      - 'code/quantum_information/**'
      - 'code/collar_alignment/**'
      - 'code/geometry/**'
      - 'code/maxent/**'
      - 'requirements.txt'
      - '.github/workflows/quantum-information.yml'
  push:
    branches: [main]
    paths:
      - 'code/quantum_information/**'
      - 'code/collar_alignment/**'
      - 'code/geometry/**'
      - 'code/maxent/**'
      - 'requirements.txt'
      - '.github/workflows/quantum-information.yml'
permissions:
  contents: read
jobs:
  entropy-and-collar-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: code
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q code/quantum_information code/collar_alignment code/geometry code/maxent
