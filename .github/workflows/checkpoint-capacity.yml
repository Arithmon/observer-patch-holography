name: Public checkpoint capacity
on:
  pull_request:
    paths:
      - 'code/capacity_readback/**'
      - 'requirements.txt'
      - '.github/workflows/checkpoint-capacity.yml'
  push:
    branches: [main]
    paths:
      - 'code/capacity_readback/**'
      - 'requirements.txt'
      - '.github/workflows/checkpoint-capacity.yml'
permissions:
  contents: read
jobs:
  exact-capacity-and-independent-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q code/capacity_readback -W error
