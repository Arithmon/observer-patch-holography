name: Completion program contract

on:
  push:
    branches: [main]
    paths:
      - 'claims/completion_program.json'
      - 'claims/executable_model_hypothesis.json'
      - 'claims/claim_registry.yaml'
      - 'docs/COMPLETION_PROGRAM.md'
      - 'docs/OPH_EXECUTABLE_HYPOTHESIS.md'
      - 'tools/build_completion_program.py'
      - 'tools/test_completion_program.py'
      - 'model/completion/**'
      - '.github/workflows/completion-program.yml'
  pull_request:
    paths:
      - 'claims/completion_program.json'
      - 'claims/executable_model_hypothesis.json'
      - 'claims/claim_registry.yaml'
      - 'docs/COMPLETION_PROGRAM.md'
      - 'docs/OPH_EXECUTABLE_HYPOTHESIS.md'
      - 'tools/build_completion_program.py'
      - 'tools/test_completion_program.py'
      - 'model/completion/**'
      - '.github/workflows/completion-program.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/build_completion_program.py --check
      - run: python -m pytest -q -W error tools/test_completion_program.py model/completion
