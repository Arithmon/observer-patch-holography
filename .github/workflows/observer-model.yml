name: Runnable observer model

on:
  pull_request:
    paths:
      - 'model/**'
      - 'code/P_derivation/**'
      - 'code/capacity_readback/**'
      - 'code/native_response/**'
      - 'code/source_scalar_packet/**'
      - 'code/source_scalar_time_refinement/**'
      - 'paper/tex_fragments/SOURCE_SCALAR_TIME_REFINEMENT.tex'
      - 'code/causal_refinement/source_net_causet.py'
      - 'Lean/Screen/PrimitivePortFrameQuotient.lean'
      - 'Lean/Screen/PortFrameGram.lean'
      - 'evidence/native_geometric_source_20260925/spec.json'
      - 'evidence/observer_dynamics_20260925/oph-physics-sim/oph_exact/carrier.py'
      - 'evidence/observer_dynamics_20260925/oph-physics-sim/oph_fpe/dynamics/self_readback_repair_closure.py'
      - 'paper/tex_fragments/SOURCE_COMMON_SCALAR_PACKET.tex'
      - 'code/source_selection_model/response.json'
      - 'code/m1_source_realization/**'
      - 'paper/tex_fragments/SOURCE_RECORD_GLUING.tex'
      - 'paper/tex_fragments/OBSERVERS_N_CLOSURE_PRO5.tex'
      - '.github/workflows/observer-model.yml'
  push:
    branches: [main]
    paths:
      - 'model/**'
      - 'code/P_derivation/**'
      - 'code/capacity_readback/**'
      - 'code/native_response/**'
      - 'code/source_scalar_packet/**'
      - 'code/source_scalar_time_refinement/**'
      - 'paper/tex_fragments/SOURCE_SCALAR_TIME_REFINEMENT.tex'
      - 'code/causal_refinement/source_net_causet.py'
      - 'Lean/Screen/PrimitivePortFrameQuotient.lean'
      - 'Lean/Screen/PortFrameGram.lean'
      - 'evidence/native_geometric_source_20260925/spec.json'
      - 'evidence/observer_dynamics_20260925/oph-physics-sim/oph_exact/carrier.py'
      - 'evidence/observer_dynamics_20260925/oph-physics-sim/oph_fpe/dynamics/self_readback_repair_closure.py'
      - 'paper/tex_fragments/SOURCE_COMMON_SCALAR_PACKET.tex'
      - 'code/source_selection_model/response.json'
      - 'code/m1_source_realization/**'
      - 'paper/tex_fragments/SOURCE_RECORD_GLUING.tex'
      - 'paper/tex_fragments/OBSERVERS_N_CLOSURE_PRO5.tex'
      - '.github/workflows/observer-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer:
    name: Observer construction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Keep complete receipt replay independent of the regression job so
    # each platform exercises both without serial compilation delays.
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m model.verify
      - run: python code/source_scalar_time_refinement/verify_source_scalar_time_refinement.py
  regression:
    name: Observer regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: python -m pip install -r model/requirements.txt
      - run: python -m pytest -q -W error model
