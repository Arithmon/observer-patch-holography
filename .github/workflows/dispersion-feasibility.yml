name: Dispersion feasibility
on:
  pull_request:
    paths:
      - 'code/dispersion_feasibility/**'
      - 'docs/research/DISPERSION_FEASIBILITY.md'
      - '.github/workflows/dispersion-feasibility.yml'
  push:
    branches: [main]
    paths:
      - 'code/dispersion_feasibility/**'
      - 'docs/research/DISPERSION_FEASIBILITY.md'
      - '.github/workflows/dispersion-feasibility.yml'
permissions:
  contents: read
jobs:
  independent-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install mpmath==1.3.0 sympy==1.14.0 pytest==9.1.1
      - run: python -m dispersion_feasibility.check
      - run: python -m pytest -q code/dispersion_feasibility
