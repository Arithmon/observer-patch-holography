<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Functorial Whitney certification from exact source data to physical consumers</title>
  <desc id="desc">Two invertibly related Whitney source presentations are transported together through exact stability matrices, kernel-checked certificate existence, and classical, quantum, gradient, and dynamics consumers. A lower strip shows the executable source-to-receipt path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="sourceBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0d1727"/>
    </linearGradient>
    <linearGradient id="exactBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24213e"/>
      <stop offset="1" stop-color="#141529"/>
    </linearGradient>
    <linearGradient id="consumerBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17332d"/>
      <stop offset="1" stop-color="#10231f"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#55dff4"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#a994ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#63daa7"/>
    </marker>
    <style>
      .title { fill:#f4f7fb; font:600 38px Inter,Segoe UI,sans-serif; }
      .subtitle { fill:#aebbd0; font:400 19px Inter,Segoe UI,sans-serif; }
      .section { fill:#55dff4; font:600 17px Inter,Segoe UI,sans-serif; letter-spacing:1.8px; }
      .box-title { fill:#f4f7fb; font:600 24px Inter,Segoe UI,sans-serif; }
      .body { fill:#d7deea; font:400 19px Inter,Segoe UI,sans-serif; }
      .small { fill:#aebbd0; font:400 16px Inter,Segoe UI,sans-serif; }
      .edge { fill:#c9f7ff; font:600 17px Inter,Segoe UI,sans-serif; }
      .violet { fill:#d7ccff; }
      .green { fill:#c9f8df; }
      .node { stroke-width:2; rx:18; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="250" fill="#55dff4" opacity="0.045"/>
  <circle cx="1420" cy="220" r="300" fill="#a994ff" opacity="0.055"/>

  <text x="800" y="62" text-anchor="middle" class="title">Functorial Whitney certification</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">Representation changes commute with exact certification and existing physical consumers</text>

  <text x="90" y="142" class="section">LAWFUL SOURCE REEXPRESSION</text>
  <rect x="90" y="165" width="450" height="175" class="node" fill="url(#sourceBox)" stroke="#55dff4"/>
  <text x="315" y="208" text-anchor="middle" class="box-title">Whitney presentation X</text>
  <text x="315" y="246" text-anchor="middle" class="body">gradient D · curl C</text>
  <text x="315" y="278" text-anchor="middle" class="body">edge mass M₁ · face mass M₂</text>
  <text x="315" y="310" text-anchor="middle" class="small">constraint · C D = 0 · signed assembly</text>

  <rect x="1060" y="165" width="450" height="175" class="node" fill="url(#sourceBox)" stroke="#55dff4"/>
  <text x="1285" y="208" text-anchor="middle" class="box-title">Whitney presentation Y</text>
  <text x="1285" y="246" text-anchor="middle" class="body">D′ = E D · C′ = F C E⁻¹</text>
  <text x="1285" y="278" text-anchor="middle" class="body">M₁′ = E M₁ Eᵀ · M₂′ = F M₂ Fᵀ</text>
  <text x="1285" y="310" text-anchor="middle" class="small">same source semantics, different coordinates</text>

  <line x1="550" y1="245" x2="1040" y2="245" stroke="#55dff4" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="795" y="210" text-anchor="middle" class="edge">invertible signed policy (E, F)</text>
  <text x="795" y="272" text-anchor="middle" class="small">identity and composition checked</text>

  <text x="600" y="390" class="section violet">EXACT CERTIFICATE TRANSPORT</text>
  <rect x="90" y="413" width="450" height="160" class="node" fill="url(#exactBox)" stroke="#a994ff"/>
  <text x="315" y="455" text-anchor="middle" class="box-title">Exact stability A</text>
  <text x="315" y="492" text-anchor="middle" class="body">A = 24 M₁ − Cᵀ M₂ C</text>
  <text x="315" y="527" text-anchor="middle" class="small">∃ c, Lean check(A, c) = true</text>

  <rect x="1060" y="413" width="450" height="160" class="node" fill="url(#exactBox)" stroke="#a994ff"/>
  <text x="1285" y="455" text-anchor="middle" class="box-title">Exact stability A′</text>
  <text x="1285" y="492" text-anchor="middle" class="body">A′ = E A Eᵀ</text>
  <text x="1285" y="527" text-anchor="middle" class="small">checked-certificate existence iff source</text>

  <line x1="550" y1="492" x2="1040" y2="492" stroke="#a994ff" stroke-width="3" marker-end="url(#arrowViolet)"/>
  <text x="795" y="462" text-anchor="middle" class="edge violet">exact congruence</text>
  <text x="795" y="526" text-anchor="middle" class="small">semantic existence moves; LDL witness may be regenerated</text>

  <line x1="315" y1="340" x2="315" y2="400" stroke="#a994ff" stroke-width="3" marker-end="url(#arrowViolet)"/>
  <line x1="1285" y1="340" x2="1285" y2="400" stroke="#a994ff" stroke-width="3" marker-end="url(#arrowViolet)"/>

  <text x="600" y="625" class="section green">NATURAL PHYSICAL CONSUMERS</text>
  <rect x="90" y="648" width="450" height="170" class="node" fill="url(#consumerBox)" stroke="#63daa7"/>
  <text x="315" y="690" text-anchor="middle" class="box-title">Consumers on X</text>
  <text x="315" y="728" text-anchor="middle" class="body">classical action · quantum Hamiltonian</text>
  <text x="315" y="760" text-anchor="middle" class="body">curl(gradient) = 0 · dynamics gap &gt; 0</text>
  <text x="315" y="792" text-anchor="middle" class="small">#916 modes and Maxwell dynamics</text>

  <rect x="1060" y="648" width="450" height="170" class="node" fill="url(#consumerBox)" stroke="#63daa7"/>
  <text x="1285" y="690" text-anchor="middle" class="box-title">Consumers on Y</text>
  <text x="1285" y="728" text-anchor="middle" class="body">same action · transported Hamiltonian</text>
  <text x="1285" y="760" text-anchor="middle" class="body">same chain law · transported stability</text>
  <text x="1285" y="792" text-anchor="middle" class="small">commuting naturality equations</text>

  <line x1="315" y1="573" x2="315" y2="635" stroke="#63daa7" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="1285" y1="573" x2="1285" y2="635" stroke="#63daa7" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="550" y1="733" x2="1040" y2="733" stroke="#63daa7" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="795" y="702" text-anchor="middle" class="edge green">naturality: transport then consume = consume then transport</text>
  <text x="795" y="765" text-anchor="middle" class="small">closest current structure: groupoid-equivariant pipeline</text>

  <rect x="70" y="865" width="1460" height="92" rx="18" fill="#0a101b" stroke="#344157" stroke-width="2"/>
  <text x="100" y="893" class="section">EXECUTABLE PATH</text>
  <text x="100" y="931" class="body">strict source JSON</text>
  <text x="307" y="931" class="body">→ untrusted LDL producer</text>
  <text x="586" y="931" class="body">→ Lean kernel checker</text>
  <text x="830" y="931" class="body">→ semantic consumer build</text>
  <text x="1124" y="931" class="body">→ bound receipt</text>
  <text x="1505" y="986" text-anchor="end" class="small">Functorial laws are proved; no Category/Functor instance is claimed.</text>
</svg>
